<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CIMON 제품 선택 가이드</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #f0ede8;
      font-family: Arial, sans-serif;
    }

    #cimonApp {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #f0ede8;
    }

    #status {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #555;
      font-size: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="status">Loading...</div>
  <iframe id="cimonApp" src="<?= appUrl ?>" allow="clipboard-read; clipboard-write"></iframe>

  <script>
    const appFrame = document.getElementById('cimonApp');
    const status = document.getElementById('status');
    const appOrigin = new URL('<?= appUrl ?>').origin;

    appFrame.addEventListener('load', () => {
      status.style.display = 'none';
    });

    window.addEventListener('message', (event) => {
      if (event.origin !== appOrigin) return;

      const message = event.data || {};
      if (message.source !== 'cimon-quote-app' || message.type !== 'PROCESS_QUOTE') return;

      google.script.run
        .withSuccessHandler((result) => {
          appFrame.contentWindow.postMessage({
            source: 'cimon-appscript-bridge',
            type: 'PROCESS_QUOTE_RESULT',
            requestId: message.requestId,
            result,
          }, appOrigin);
        })
        .withFailureHandler((error) => {
          appFrame.contentWindow.postMessage({
            source: 'cimon-appscript-bridge',
            type: 'PROCESS_QUOTE_RESULT',
            requestId: message.requestId,
            error: String(error),
          }, appOrigin);
        })
        .processQuoteFromReact(message.payload);
    });
  </script>
</body>
</html>
